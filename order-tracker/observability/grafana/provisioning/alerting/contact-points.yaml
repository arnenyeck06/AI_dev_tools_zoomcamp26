# Sends alerts to the incident responder (incident-response/), which runs on
# the host at port 8001. Grafana runs in Docker and reaches the host through
# host.docker.internal (see extra_hosts in compose.yaml).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: incident-responder
    receivers:
      - uid: incident-responder-webhook
        type: webhook
        settings:
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: incident-responder
    group_by: [grafana_folder, alertname]
    # Notify quickly after an alert starts firing.
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
