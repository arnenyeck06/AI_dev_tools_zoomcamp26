# Whole system with one command: docker compose up --build
#   web  http://localhost:8080   React app (customer page, staff dashboard at /#/staff)
#   api  FastAPI, reached through web: /api, and its docs at http://localhost:8080/docs
#   db   PostgreSQL, data kept in the "pgdata" volume
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://orders:orders@db:5432/orders
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
